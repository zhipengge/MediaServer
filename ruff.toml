target-version = "py312"
line-length = 110
extend-exclude = [".venv", "data", "media", "deploy"]

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# E501 is handled by the formatter; Chinese comments are naturally wide.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105"]

[lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]
