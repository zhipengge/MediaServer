# MediaServer on a NAS or home server.
#
#   cp .env.example .env      # edit the host paths
#   docker compose up -d --build
#   docker compose logs -f --tail=100
#
# The music library is mounted read-only; the only writable mount is /data.

services:
  mediaserver:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: mediaserver:1.3.0
    container_name: mediaserver
    restart: unless-stopped
    ports:
      - "${MEDIA_PORT:-8080}:8080"
    volumes:
      - "${MUSIC_HOST_DIR:?set MUSIC_HOST_DIR}:/music:ro"
      - "${MEDIA_HOST_DIR:-./media}:/library:ro"
      - "${DATA_HOST_DIR:?set DATA_HOST_DIR}:/data"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      MUSIC_ROOT: /music
      MEDIA_VIDEO_ROOT: /library/videos
      MEDIA_IMAGE_ROOT: /library/images
      MEDIA_DOC_ROOT: /library/docs
      MEDIA_DATA_DIR: /data
      MEDIA_HOST: 0.0.0.0
      MEDIA_PORT: "8080"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Uncomment when the server is reachable from the internet.
      # MEDIA_AUTH_MODE: token
      # MEDIA_TOKEN: "${MEDIA_TOKEN:?set MEDIA_TOKEN}"
      # MEDIA_PUBLIC_URL: "https://media.example.com"
      # MEDIA_TRUST_PROXY: "1"
      # MEDIA_COOKIE_SECURE: "1"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
